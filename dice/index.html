<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주사위로 다음 말 고르기</title>
<style>
  :root { --ink:#1E1B2E; --brand:#4338CA; --accent:#EA580C; --green:#16A34A; --bg:#FAFAF8; --line:#E5E7EB; --muted:#6B7280; --card:#fff; --hl:#EEF2FF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; line-height:1.5; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
  h1 { font-size:24px; margin:0; }
  select { font-size:18px; padding:6px 10px; border-radius:8px; border:2px solid var(--line); background:#fff; }
  .sentence { font-size:clamp(20px,3.4vw,30px); text-align:center; margin:20px 0 16px; font-weight:700; }
  .blank { display:inline-block; min-width:3.2em; border-bottom:3px solid var(--brand); color:var(--brand); padding:0 6px; }
  .blank.done { color:var(--accent); border-color:var(--accent); }
  .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:700px) { .cols { grid-template-columns:1fr; } }
  .col { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px 14px; transition:border-color .2s; }
  .col.active { border-color:var(--brand); box-shadow:0 0 0 3px var(--hl); }
  .col h2 { font-size:17px; margin:0 0 8px; color:var(--brand); }
  .opt { display:flex; gap:10px; padding:6px 8px; border-radius:8px; font-size:17px; }
  .opt b { min-width:4.2em; color:var(--muted); }
  .opt.hit { background:#FFEDD5; font-weight:700; }
  .roll { display:flex; flex-direction:column; align-items:center; gap:14px; margin:22px 0; }
  .die { width:110px; height:110px; background:#fff; border:3px solid var(--ink); border-radius:20px; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:14px; }
  .die i { width:20px; height:20px; border-radius:50%; background:var(--ink); place-self:center; visibility:hidden; }
  .die.rolling { animation:shake .5s; }
  @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-14deg)} 75%{transform:rotate(14deg)} }
  button { font-size:20px; font-weight:700; padding:12px 28px; border-radius:999px; border:0; background:var(--brand); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--brand); border:2px solid var(--brand); font-size:16px; padding:8px 18px; }
  button:disabled { opacity:.4; cursor:default; }
  .hint { color:var(--muted); font-size:14px; }
  .log { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px 16px; margin-top:8px; }
  .log h2 { font-size:17px; margin:0 0 6px; }
  .log ol { margin:0; padding-left:22px; }
  details { margin-top:18px; }
  summary { cursor:pointer; font-weight:700; color:var(--brand); }
  .bar { display:grid; grid-template-columns:1fr 60px; gap:8px; align-items:center; font-size:14px; margin:4px 0; }
  .bar div { background:var(--hl); border-radius:6px; overflow:hidden; }
  .bar span { display:block; background:var(--brand); color:#fff; padding:2px 8px; white-space:nowrap; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎲 내가 AI 언어 모델이 되어 보기</h1>
    <label>모둠 <select id="group"></select></label>
  </header>

  <p class="sentence">"달에 처음 발을 디딘 사람은 <span class="blank" id="b0">①</span>이다. 그는 <span class="blank" id="b1">②</span> <span class="blank" id="b2">③</span>."</p>

  <div class="cols" id="cols"></div>

  <div class="roll">
    <div class="die" id="die"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <button id="rollBtn">① 누가 — 굴리기</button>
    <button class="ghost" id="resetBtn">처음부터 다시</button>
    <span class="hint">스페이스바로도 굴릴 수 있습니다</span>
  </div>

  <div class="log"><h2>우리 반 문장</h2><ol id="log"></ol></div>

  <details>
    <summary>여러 번 굴려 보면? (100번 자동으로 굴리기)</summary>
    <p class="hint">같은 표로 100번 문장을 만들면 어떤 문장이 얼마나 나올까요? 어떤 문장이 사실인지는 표에 없습니다. 확인은 사람이 합니다.</p>
    <button class="ghost" id="simBtn">100번 굴리기</button>
    <div id="sim"></div>
  </details>

  <p class="hint" style="margin-top:24px"><a href="../" target="_blank" rel="noopener">특강 자료 모음으로</a></p>
</main>
<script>
const STEPS = [
  { title: "① 누가", opts: [[[1,2,3], "닐 암스트롱"], [[4,5], "버즈 올드린"], [[6], "유리 가가린"]] },
  { title: "② 언제", opts: [[[1,2,3,4], "1969년에"], [[5], "1961년에"], [[6], "1972년에"]] },
  { title: "③ 뭐라고", opts: [[[1,2,3,4], "\"인류의 위대한 도약\"이라고 말했다"], [[5,6], "\"지구는 푸르다\"라고 말했다"]] },
];
const PIPS = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
const $ = id => document.getElementById(id);
let step = 0, picks = [], busy = false;

const sel = $("group");
for (let g = 1; g <= 10; g++) sel.add(new Option(`${g}모둠`, g));

$("cols").innerHTML = STEPS.map((s, i) =>
  `<div class="col" id="c${i}"><h2>${s.title}</h2>` +
  s.opts.map(([nums, word], j) => `<div class="opt" id="o${i}_${j}"><b>${nums.join("·")}</b><span>${word}</span></div>`).join("") +
  `</div>`).join("");

function d6() { const a = new Uint8Array(1); do { crypto.getRandomValues(a); } while (a[0] >= 252); return a[0] % 6 + 1; }
function wordFor(i, n) { return STEPS[i].opts.findIndex(([nums]) => nums.includes(n)); }
function showDie(n) { [...$("die").children].forEach((p, k) => p.style.visibility = PIPS[n].includes(k) ? "visible" : "hidden"); }
function render() {
  STEPS.forEach((s, i) => {
    $("c" + i).classList.toggle("active", i === step);
    s.opts.forEach((_, j) => $(`o${i}_${j}`).classList.toggle("hit", picks[i] === j));
    const b = $("b" + i);
    b.textContent = picks[i] === undefined ? "①②③"[i] : s.opts[picks[i]][1];
    b.classList.toggle("done", picks[i] !== undefined);
  });
  $("rollBtn").textContent = step < 3 ? `${STEPS[step].title} — 굴리기` : "문장 완성! 소리 내어 읽어 보세요";
  $("rollBtn").disabled = step >= 3;
}
function roll() {
  if (busy || step >= 3) return;
  busy = true; $("die").classList.add("rolling");
  let t = 0; const spin = setInterval(() => showDie(d6()), 70);
  setTimeout(() => {
    clearInterval(spin); const n = d6(); showDie(n);
    $("die").classList.remove("rolling");
    picks[step] = wordFor(step, n); step++; busy = false; render();
    if (step === 3) {
      const li = document.createElement("li");
      li.textContent = `${sel.value}모둠: 달에 처음 발을 디딘 사람은 ${STEPS[0].opts[picks[0]][1]}이다. 그는 ${STEPS[1].opts[picks[1]][1]} ${STEPS[2].opts[picks[2]][1]}.`;
      $("log").appendChild(li);
    }
  }, 600);
}
function reset() { step = 0; picks = []; showDie(1); render(); }
function simulate() {
  const counts = {};
  for (let k = 0; k < 100; k++) {
    const key = STEPS.map((s, i) => s.opts[wordFor(i, d6())][1]).join(" · ");
    counts[key] = (counts[key] || 0) + 1;
  }
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  $("sim").innerHTML = `<p class="hint">서로 다른 문장 ${rows.length}가지가 나왔습니다.</p>` +
    rows.map(([k, v]) => `<div class="bar"><div><span style="width:${Math.max(v, 8)}%">${k}</span></div><b>${v}번</b></div>`).join("");
}
$("rollBtn").onclick = roll;
$("resetBtn").onclick = reset;
$("simBtn").onclick = simulate;
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target.tagName !== "SELECT") { e.preventDefault(); roll(); } });
reset();
</script>
</body>
</html>
