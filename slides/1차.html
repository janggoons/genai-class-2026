section {
  font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  background: #FAFAF8;
  color: #1E1B2E;
  padding: 56px 68px;
  font-size: 27px;
}
h1 {
  font-size: 46px;
  font-weight: 900;
  color: #1E1B2E;
  margin-bottom: 6px;
}
h2 {
  font-size: 34px;
  font-weight: 700;
  color: #4338CA;
  margin-bottom: 14px;
}
h3 {
  font-size: 27px;
  font-weight: 700;
  color: #EA580C;
}
strong { color: #4338CA; }
em { color: #EA580C; font-style: normal; font-weight: 700; }
section.lead {
  background: linear-gradient(135deg, #312E81 0%, #4338CA 55%, #6D28D9 100%);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
section.lead h1 { color: #FFFFFF; font-size: 52px; }
section.lead h2 { color: #FDE68A; }
section.lead p { color: #E0E7FF; }
section.part {
  background: #1E1B2E;
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
section.part h1 { color: #FFFFFF; font-size: 54px; }
section.part .badge {
  width: 90px; height: 90px;
  border-radius: 50%;
  background: #F97316;
  color: #1E1B2E;
  font-size: 44px;
  font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
section.part .msg { color: #C7D2FE; font-size: 26px; margin-top: 10px; }
section.break {
  background: #FDF4E3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
section.break h1 { font-size: 60px; color: #EA580C; }
section.qa {
  background: #EEF2FF;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: start; }
.card {
  background: #FFFFFF;
  border: 2px solid #E5E7EB;
  border-radius: 16px;
  padding: 20px 24px;
}
.card.bad { border-color: #FCA5A5; background: #FEF2F2; }
.card.good { border-color: #86EFAC; background: #F0FDF4; }
.tag {
  display: inline-block;
  background: #4338CA;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  padding: 4px 14px;
  border-radius: 999px;
  margin-bottom: 10px;
}
.tag.orange { background: #EA580C; }
.tag.green { background: #16A34A; }
.tag.red { background: #DC2626; }
.big { font-size: 40px; font-weight: 900; color: #4338CA; }
.center { text-align: center; }
.small { font-size: 20px; color: #6B7280; }
.warn {
  background: #FEF3C7;
  border-left: 8px solid #F59E0B;
  padding: 14px 20px;
  border-radius: 8px;
  font-size: 24px;
}
img { border-radius: 10px; }
table { font-size: 24px; }
ul, ol { font-size: 27px; }
.photo {
  width: 250px; height: 250px;
  margin: 0 auto;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #E5E7EB;
}
.photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: top;
  border-radius: 0;
}
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: start; }
.excard {
  background: #FFFFFF;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
}
.excard img {
  width: 100%; height: 230px;
  object-fit: contain;
  background: #fff;
  border-radius: 6px;
}
.excard img.crop { object-fit: cover; object-position: top; }
.excard .cap { font-size: 19px; color: #374151; margin-top: 6px; font-weight: 700; }
.book {
  width: 180px;
  margin: 0 auto;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #E5E7EB;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}
.book img { width: 100%; display: block; border-radius: 0; }
.shot { background:#FFFFFF; border:2px solid #E5E7EB; border-radius:12px; padding:8px; }
.shot img { width:100%; display:block; border-radius:6px; border:1px solid #E5E7EB; }
.shot img.fix { height:170px; object-fit:cover; object-position:top; }
.shot img.tweet { width:auto; height:440px; margin:0 auto; }
img.qr { width:230px; height:230px; }
img.qrs { width:100px; height:100px; }
.qrline { display:flex; align-items:center; gap:18px; margin-top:12px; font-size:22px; }
.shot .cap { font-size:15px; color:#6B7280; margin-top:4px; text-align:center; }
.news { font-size:23px; }
.news ul { font-size:23px; margin:4px 0; }
img.qrbig { width:300px; height:300px; }

<p>모둠별로 <strong>주사위 웹앱</strong>에서 <strong>세 번 굴려</strong> 다음 말을 고르고 문장을 완성합니다.</p>
<p class="center" style="font-size:30px; margin:6px 0 14px">"달에 처음 발을 디딘 사람은 <em>①</em>이다. 그는 <em>②</em> <em>③</em>."</p>
<div class="grid3">
<div class="card">
<p><span class="tag">① 누가</span></p>
<p><strong>1·2·3</strong> 닐 암스트롱<br />
<strong>4·5</strong> 버즈 올드린<br />
<strong>6</strong> 유리 가가린</p>
</div>
<div class="card">
<p><span class="tag orange">② 언제</span></p>
<p><strong>1·2·3·4</strong> 1969년에<br />
<strong>5</strong> 1961년에<br />
<strong>6</strong> 1972년에</p>
</div>
<div class="card">
<p><span class="tag green">③ 뭐라고</span></p>
<p><strong>1·2·3·4</strong> &quot;인류의 위대한 도약&quot;이라고 말했다<br />
<strong>5·6</strong> &quot;지구는 푸르다&quot;라고 말했다</p>
</div>
</div>

</div>

<h2 id="%EB%AC%B4%EC%97%87%EC%9D%84-%EC%95%8C-%EC%88%98-%EC%9E%88%EB%82%98%EC%9A%94">무엇을 알 수 있나요?</h2>
<div class="grid3">
<div class="card good center">
<p><strong>모든 문장이</strong></p>
<p class="big">자연스럽다</p>
<p>문법도 어색하지 않습니다</p>
</div>
<div class="card bad center">
<p><strong>사실인 문장은</strong></p>
<p class="big">하나뿐</p>
<p>암스트롱 · 1969년 · 도약<br />나올 확률은 약 <strong>22%</strong></p>
</div>
<div class="card center">
<p><strong>표에 없는 것</strong></p>
<p class="big">'사실인가'</p>
<p>있는 것은 확률뿐입니다</p>
</div>
</div>
<div class="warn" style="margin-top:18px">
<p>AI도 <strong>그럴듯한 다음 말</strong>을 확률로 고릅니다. 다만 실제 AI는 칸을 따로 굴리지 않고 <strong>앞에 고른 말을 모두 보고</strong> 다음 말의 확률을 바꿉니다(가가린이 나오면 → 1961년이 더 그럴듯). 그래도 고르는 것은 확률, <em>그럴듯함과 사실은 다릅니다.</em></p>
</div>
<p class="small" style="margin-top:6px; line-height:1.4; font-size:17px"><b>왜 번호를 다르게?</b> 자주 함께 나오는 말에 번호를 더 줬습니다. 칸마다 정답이 1등이어도 셋 다 맞을 확률은 ½ × ⅔ × ⅔ ≈ 22%.<br /><b>앞의 말을 보는 방법:</b> 어디에 주목할지 계산하는 <b>어텐션(attention)</b>, 이것을 쌓은 구조가 <b>트랜스포머(Transformer, 2017)</b>입니다. ChatGPT의 GPT에서 T이고, Gemini도 트랜스포머 기반입니다.</p>

  background: #4338CA;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  padding: 4px 14px;
  border-radius: 999px;
  margin-bottom: 10px;
}
.tag.orange { background: #EA580C; }
.tag.green { background: #16A34A; }
.tag.red { background: #DC2626; }
.big { font-size: 40px; font-weight: 900; color: #4338CA; }
.center { text-align: center; }
.small { font-size: 20px; color: #6B7280; }
.warn {
  background: #FEF3C7;
  border-left: 8px solid #F59E0B;
  padding: 14px 20px;
  border-radius: 8px;
  font-size: 24px;
}
img { border-radius: 10px; }
table { font-size: 24px; }
ul, ol { font-size: 27px; }
.photo {
  width: 250px; height: 250px;
  margin: 0 auto;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #E5E7EB;
}
.photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: top;
  border-radius: 0;
}
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: start; }
.excard {
  background: #FFFFFF;

  border-radius: 12px;
  padding: 10px;
  text-align: center;
}

  width: 100%; height: 230px;

  background: #fff;
  border-radius: 6px;
}

.book {
  width: 180px;
  margin: 0 auto;
  border-radius: 6px;

.shot img { width:100%; display:block; border-radius:6px; border:1px solid #E5E7EB; }
.shot img.fix { height:170px; object-fit:cover; object-position:top; }
.shot img.tweet { width:auto; height:440px; margin:0 auto; }
img.qr { width:230px; height:230px; }
img.qrs { width:100px; height:100px; }
.qrline { display:flex; align-items:center; gap:18px; margin-top:12px; font-size:22px; }
.shot .cap { font-size:15px; color:#6B7280; margin-top:4px; text-align:center; }
.news { font-size:23px; }
.news ul { font-size:23px; margin:4px 0; }
img.qrbig { width:300px; height:300px; }
