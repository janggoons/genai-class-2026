<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영단어 카드 (예시 완성본)</title>
<style>
  :root { --ink:#1E1B2E; --brand:#4338CA; --accent:#EA580C; --green:#16A34A; --red:#DC2626; --bg:#FAFAF8; --line:#E5E7EB; --muted:#6B7280; --hl:#EEF2FF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; line-height:1.5; -webkit-tap-highlight-color:transparent; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 56px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; font-size:15px; }
  h2 { font-size:19px; color:var(--brand); margin:26px 0 8px; }
  .box { background:#fff; border:2px solid var(--line); border-radius:14px; padding:16px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 180px; font-size:20px; padding:10px 12px; border:2px solid var(--line); border-radius:10px; }
  button { font-size:20px; font-weight:700; padding:12px 22px; border-radius:999px; border:0; background:var(--brand); color:#fff; cursor:pointer; }
  button:disabled { opacity:.4; }
  .msg { min-height:24px; color:var(--red); font-size:15px; margin:8px 0 0; }
  .card { text-align:center; padding:36px 16px; }
  .word { font-size:52px; font-weight:800; word-break:break-word; }
  .meaning { font-size:32px; color:var(--accent); min-height:48px; margin:12px 0 20px; word-break:break-word; }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .know { background:var(--green); } .dont { background:var(--red); }
  .stat { color:var(--muted); font-size:15px; margin-top:16px; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:18px; }
  li small { color:var(--muted); }
  li button { font-size:14px; padding:6px 12px; background:#9CA3AF; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🃏 영단어 카드</h1>
  <p class="sub">내가 넣은 단어만 나옵니다. 뜻을 먼저 떠올린 뒤 확인하고, 몰랐던 단어는 다음 5장 안에 다시 나옵니다.</p>

  <h2>1. 단어 넣기</h2>
  <div class="box">
    <form id="add">
      <input id="w" placeholder="단어 (예: apple)" autocomplete="off" autocapitalize="off">
      <input id="m" placeholder="뜻 (예: 사과)" autocomplete="off">
      <button>추가</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>

  <h2>2. 외우기</h2>
  <div class="box card" id="play"></div>

  <h2>내 단어 목록</h2>
  <div class="box"><ul id="list"></ul></div>
</main>
<script>
// 단어는 이 기기 브라우저에만 저장된다(서버로 보내지 않음).
const KEY = "genai-class-wordcards";
let words = [];   // {w, m, know, dont}
let queue = [];   // 다음에 나올 단어의 순서(words의 인덱스)
let shown = false;

try { words = JSON.parse(localStorage.getItem(KEY)) || []; } catch { words = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(words)); } catch {} };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function refill() {
  queue = words.map((_, i) => i).sort(() => Math.random() - 0.5);
}

$("add").onsubmit = e => {
  e.preventDefault();
  const w = $("w").value.trim(), m = $("m").value.trim();
  if (!w || !m) { $("msg").textContent = "단어와 뜻을 모두 써 주세요."; return; }
  if (words.some(x => x.w.toLowerCase() === w.toLowerCase())) { $("msg").textContent = `'${w}'는 이미 있습니다.`; return; }
  words.push({ w, m, know: 0, dont: 0 });
  queue.push(words.length - 1);
  save(); $("msg").textContent = ""; $("w").value = ""; $("m").value = ""; $("w").focus();
  render();
};

function answer(knew) {
  const i = queue.shift();
  if (knew) { words[i].know++; queue.push(i); }
  else { words[i].dont++; queue.splice(Math.min(2, queue.length), 0, i); }  // 몰랐다 → 3번째 안에 다시
  shown = false; save(); render();
}

function remove(i) {
  words.splice(i, 1);
  queue = queue.filter(q => q !== i).map(q => q > i ? q - 1 : q);
  save(); render();
}

function render() {
  if (words.length && !queue.length) refill();
  const p = $("play");
  if (!words.length) {
    p.innerHTML = '<p class="empty">위에서 단어를 하나 이상 넣으면 시작합니다.</p>';
  } else {
    const x = words[queue[0]];
    p.innerHTML = `<div class="word">${esc(x.w)}</div>
      <div class="meaning">${shown ? esc(x.m) : ""}</div>
      <div class="row">${shown
        ? '<button class="know" id="k">알았다</button><button class="dont" id="d">몰랐다</button>'
        : '<button id="s">뜻을 떠올렸으면 확인</button>'}</div>
      <p class="stat">이 단어: 알았다 ${x.know} · 몰랐다 ${x.dont} · 전체 ${words.length}개</p>`;
    if (shown) { $("k").onclick = () => answer(true); $("d").onclick = () => answer(false); }
    else $("s").onclick = () => { shown = true; render(); };
  }
  $("list").innerHTML = words.length
    ? words.map((x, i) => `<li><span>${esc(x.w)} — ${esc(x.m)} <small>(몰랐다 ${x.dont})</small></span><button data-i="${i}">삭제</button></li>`).join("")
    : '<li class="empty">아직 없습니다.</li>';
  document.querySelectorAll("#list button").forEach(b => b.onclick = () => remove(+b.dataset.i));
}
render();
</script>
</body>
</html>
